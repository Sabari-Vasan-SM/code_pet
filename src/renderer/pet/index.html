<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodePet Overlay</title>
  <link rel="stylesheet" href="./pet.css">
</head>
<body>
  <div id="pet-root" class="pet-root">
    <!-- Contextual Speech Bubble -->
    <div id="speech-bubble" class="speech-bubble hidden">
      <div id="speech-text" class="speech-text">hello dev!</div>
      <div class="speech-tail"></div>
    </div>

    <!-- Floating Interactive Action Dock (Reveals on hover) -->
    <div id="action-dock" class="action-dock">
      <button class="dock-btn" id="btn-snack" title="Feed Fish Snack 🐟">🐟</button>
      <button class="dock-btn" id="btn-toy" title="Play with Yarn Ball 🧶">🧶</button>
      <button class="dock-btn" id="btn-coffee" title="Give Dev Coffee ☕">☕</button>
      <button class="dock-btn" id="btn-laser" title="Laser Pointer Mode 🔴">🔴</button>
      <button class="dock-btn" id="btn-sleep" title="Nap / Wake 💤">💤</button>
      <button class="dock-btn" id="btn-settings" title="Settings ⚙️">⚙️</button>
    </div>

    <!-- Particle & Toys Canvas Layer -->
    <canvas id="particle-canvas" class="particle-canvas" width="260" height="240"></canvas>

    <!-- Laser pointer dot -->
    <div id="laser-dot" class="laser-dot hidden"></div>

    <!-- Interactive Pet Canvas -->
    <div id="pet-container" class="pet-container">
      <canvas id="pet-canvas" class="pet-canvas" width="96" height="96"></canvas>
      <div id="affection-badge" class="affection-badge hidden">+5 ❤️</div>
    </div>

    <!-- Custom Right Click Menu -->
    <div id="context-menu" class="context-menu hidden">
      <div class="menu-item" data-action="pet">❤️ Pet & Stroke</div>
      <div class="menu-item" data-action="feed">🐟 Feed Fish Snack</div>
      <div class="menu-item" data-action="play">🧶 Play Yarn Ball</div>
      <div class="menu-item" data-action="coffee">☕ Sip Coffee</div>
      <div class="menu-item" data-action="dance">💃 Victory Dance</div>
      <div class="menu-item" data-action="sleep">💤 Quick Catnap</div>
      <div class="menu-item" data-action="wake">⚡ Wake Up</div>
      <div class="menu-separator"></div>
      <div class="menu-item" data-action="settings">⚙️ Settings</div>
      <div class="menu-item" data-action="hide">👁️ Hide Pet</div>
    </div>
  </div>

  <script type="module" src="./pet.ts"></script>
</body>
</html>
